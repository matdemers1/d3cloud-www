<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Independent software studio building privacy-first everyday tools."
    />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Demers Design and Development</title>
    <script>
      // Apply theme before paint to prevent flash. @d3cloud/ui keys off
      // data-theme; with no stored choice it is left unset so the system
      // follows prefers-color-scheme on its own.
      (function () {
        try {
          var stored = localStorage.getItem('d3cloud-theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
